<!DOCTYPE html>
<html>
<head>
  <base href="/bahar-chale/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="बाहर चलें (Bahar Chale) - सामुदायिक यात्रा समन्वय">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="बाहर चलें">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>बाहर चलें (Bahar Chale)</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #F8FAFC;
    }
    #loading-splash {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Devanagari", "Kohinoor Devanagari", Helvetica, Arial, sans-serif;
      z-index: 99999;
      transition: opacity 0.4s ease-out;
    }
    .splash-card {
      text-align: center;
      padding: 32px 24px;
      max-width: 380px;
    }
    .splash-icon-wrapper {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px auto;
      background: rgba(13, 148, 136, 0.12);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    .splash-title {
      font-size: 28px;
      font-weight: 800;
      color: #0F172A;
      margin: 0 0 6px 0;
      letter-spacing: -0.5px;
    }
    .splash-subtitle {
      font-size: 15px;
      color: #64748B;
      margin: 0 0 28px 0;
      font-weight: 500;
    }
    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #E2E8F0;
      border-top-color: #0D9488;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px auto;
    }
    .splash-status {
      font-size: 13px;
      color: #94A3B8;
      margin: 0;
      font-weight: 500;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-splash">
    <div class="splash-card">
      <div class="splash-icon-wrapper">🚗</div>
      <h1 class="splash-title">Bahar Chale</h1>
      <p class="splash-subtitle">बाहर चलें • Community Travel & Ride Coordination</p>
      <div class="splash-spinner"></div>
      <p class="splash-status">Loading app, please wait / ऐप लोड हो रहा है...</p>
    </div>
  </div>

  <script>
    var splashRemoved = false;
    function removeSplash() {
      if (splashRemoved) return;
      splashRemoved = true;
      var splash = document.getElementById('loading-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash && splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
        }, 400);
      }
    }

    // Remove splash only when Flutter engine renders its first real frame
    window.addEventListener('flutter-first-frame', removeSplash);

    // Progressive status update if loading takes longer on mobile/slow connections
    setTimeout(function () {
      if (!splashRemoved) {
        var statusEl = document.querySelector('.splash-status');
        if (statusEl) {
          statusEl.textContent = 'धीमी इंटरनेट गति: संसाधन लोड हो रहे हैं...';
        }
      }
    }, 6000);

    setTimeout(function () {
      if (!splashRemoved) {
        var statusEl = document.querySelector('.splash-status');
        if (statusEl) {
          statusEl.innerHTML = 'कृपया प्रतीक्षा करें... <br><button onclick="window.location.reload(true)" style="margin-top:12px;padding:8px 16px;background:#0D9488;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">पुनः लोड करें (Reload)</button>';
        }
      }
    }, 18000);

    // Global error listener to prevent silent blank screens
    window.addEventListener('error', function (e) {
      if (!splashRemoved) {
        var statusEl = document.querySelector('.splash-status');
        if (statusEl) {
          statusEl.innerHTML = '<span style="color:#DC2626;">लोड करने में त्रुटि आई।</span><br><button onclick="window.location.reload(true)" style="margin-top:12px;padding:8px 16px;background:#0D9488;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;">पेज रीफ्रेश करें (Retry)</button>';
        }
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
