name: Bahar Chale Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test_and_deploy:
    name: Build, Test & Deploy Web & Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Production Environment Variables
        run: |
          cat <<EOF > .env
          SUPABASE_URL=${{ secrets.SUPABASE_URL || 'https://iswbhvtosueavuzavtbr.supabase.co' }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzd2JodnRvc3VlYXZ1emF2dGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTc3NDgsImV4cCI6MjExMDQ5Mzc0OH0.txdBKwmldUxcVtUDB6Q2YVAwLNefynPtUuTZihT2Jq0' }}
          SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_XFn8ASxZW5yqB79f8PRwNQ_9Rnv0GzS' }}
          EOF

      - name: Compute Release Version
        id: release_version
        run: |
          git fetch --tags --force 2>/dev/null || true
          LATEST_TAG=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG="v1.0.0"
          fi
          LATEST_VER="${LATEST_TAG#v}"
          
          PUBSPEC_VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          HIGHER_VER=$(printf '%s\n%s' "$LATEST_VER" "$PUBSPEC_VER" | sort -V | tail -n 1)
          
          if [ "$PUBSPEC_VER" = "$LATEST_VER" ] || [ "$HIGHER_VER" = "$LATEST_VER" ]; then
            IFS="." read -r MAJOR MINOR PATCH <<< "$LATEST_VER"
            NEXT_PATCH=$((PATCH + 1))
            TARGET_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}"
          else
            TARGET_VERSION="$PUBSPEC_VER"
          fi
          
          TAG_NAME="v${TARGET_VERSION}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            TAG_NAME="${TAG_NAME}-b${{ github.run_number }}"
          fi
          
          echo "tag=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TARGET_VERSION}" >> $GITHUB_OUTPUT
          
          sed -i "s/^version: .*/version: ${TARGET_VERSION}+${{ github.run_number }}/" pubspec.yaml
          echo "Computed Tag Name: ${TAG_NAME}"
          echo "Updated pubspec version: $(grep '^version:' pubspec.yaml)"

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Test Suite
        run: flutter test

      # ----------------- WEB BUILD & GITHUB PAGES DEPLOY -----------------
      - name: Build Flutter Web for GitHub Pages
        run: |
          flutter build web --release --base-href /bahar-chale/
          # Ensure SPA fallback for direct URL routing on GitHub Pages
          cp build/web/index.html build/web/404.html

      - name: Deploy Web to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/web
          clean: true

      # ----------------- ANDROID BUILD & SUPABASE UPLOAD -----------------
      - name: Build Android Release APKs
        run: flutter build apk --split-per-abi --release

      - name: Upload APK to Supabase Releases Bucket
        run: |
          APK_FILE="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Uploading $APK_FILE to Supabase Storage..."
            curl -f -X POST \
              "https://iswbhvtosueavuzavtbr.supabase.co/storage/v1/object/releases/bahar-chale.apk" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzd2JodnRvc3VlYXZ1emF2dGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTc3NDgsImV4cCI6MjExMDQ5Mzc0OH0.txdBKwmldUxcVtUDB6Q2YVAwLNefynPtUuTZihT2Jq0' }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlzd2JodnRvc3VlYXZ1emF2dGJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5MTc3NDgsImV4cCI6MjExMDQ5Mzc0OH0.txdBKwmldUxcVtUDB6Q2YVAwLNefynPtUuTZihT2Jq0' }}" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "x-upsert: true" \
              --data-binary @"$APK_FILE"
            echo "Supabase APK upload completed successfully."
          else
            echo "Error: APK file not found!"
            exit 1
          fi

      - name: Create Versioned GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ steps.release_version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "Bahar Chale Release ${{ steps.release_version.outputs.tag }}"
          make_latest: true
          body: |
            ## Bahar Chale Release ${{ steps.release_version.outputs.tag }}
            - **Commit**: `${{ github.sha }}`
            - **Hosted Web App**: https://shubha95m.github.io/bahar-chale/
            - **Direct APK Download**: https://iswbhvtosueavuzavtbr.supabase.co/storage/v1/object/public/releases/bahar-chale.apk
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
